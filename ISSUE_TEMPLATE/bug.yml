name: Bug
description: Report something that isn’t working as expected.
title: "[BUG] <short summary>"
labels: ["type:bug", "status:todo", "priority:P2"]
body:
  - type: markdown
    attributes:
      value: |
        Please include clear steps, expected vs. actual behavior, and environment details.
        Attach logs or screenshots where possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the issue.
      placeholder: e.g., "Measurements pod crashes on startup when using config v3."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List each step to make the issue happen.
      placeholder: |
        1. Deploy measurement pod
        2. Run container with --enable-new-metrics
        3. Observe crash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: e.g., "Pod starts successfully and publishes metrics to ACR."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: e.g., "Pod fails to start; logs show segmentation fault."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is the impact?
      options:
        - Critical (system down)
        - High (major functionality broken)
        - Medium (partial degradation)
        - Low (cosmetic or minor)
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product / Area
      options:
        - iOS
        - Android
        - Web
        - Backend
        - API
        - Data
        - Infrastructure
        - Security
        - DevOps
        - Mobile SDKs
        - Internal Tools
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "dev / staging / prod"
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste logs or drag screenshots here.
  - type: checkboxes
    id: checklist
    attributes:
      label: Definition of Done (Bug)
      options:
        - label: Repro steps documented
          required: true
        - label: Root cause identified
          required: true
        - label: Fix verified in staging
          required: true
        - label: Regression tests added
          required: false

