name: Epic
description: High-level outcome that groups multiple features
type: epic
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What success looks like
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's included
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Features
      description: Child features/issues
      placeholder: |
        - [ ] #123
        - [ ] #124
