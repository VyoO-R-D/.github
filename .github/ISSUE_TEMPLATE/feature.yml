name: Feature
description: Shippable capability
type: feature
body:
  - type: dropdown
    id: product
    attributes:
      label: Product / Area
      description: Which product or domain does this impact?
      options:
        - iOS App
        - Backend
        - DevOps/Infra
        - Admin Tools
        - Data
        - AI/ML
        - Web (eg:Vyoo website)
        - Security & Privacy
        - SDKs & APIs
        - Developer Experience
        - QA/Testing
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What this feature does
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - Criterion 1
        - Criterion 2
    validations:
      required: true
  - type: dropdown
    id: tshirt
    attributes:
      label: Feature Size (T-shirt)
      description: Relative complexity/coordination level.
      options: [XS, S, M, L, XL]
    validations:
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready (Feature)
      options:
        - label: Outcome defined
          required: true
        - label: Acceptance criteria defined
          required: true
        - label: Dependencies linked
          required: true
