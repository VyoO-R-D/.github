name: Feature
description: Shippable capability
type: feature
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic
      description: "Type # to search and select an epic"
      placeholder: "#123"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What this feature does
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - Criterion 1
        - Criterion 2
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Child Stories/Tasks
      description: Track progress with checkboxes
      placeholder: |
        - [ ] #123
        - [ ] #124

