name: User Story
description: Sprint-sized work item that delivers value
type: user-story
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a [role], I want [capability], so that [benefit]
      placeholder: e.g. As a user, I want to sign in with Apple so that I can avoid passwords.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - Criterion 1
        - Criterion 2
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Points
      options: ["1","2","3","5","8","13"]
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready 
      options:
        - label: Story description clearly defined
          required: true
        - label: Acceptance criteria defined
          required: true
